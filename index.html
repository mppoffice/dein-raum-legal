<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raum Gottes</title>
  <meta name="description" content="Datenschutz und Support für die App Raum Gottes.">
  <style>
    :root {
      --bg: #f3eee4;
      --ink: #2a2622;
      --muted: #6d655b;
      --line: #d8cfc0;
      --link: #3f3428;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 34rem;
      margin: 0 auto;
      padding: 4.5rem 1.4rem 6rem;
    }
    p.mark {
      margin: 0 0 2.4rem;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 0.7rem;
      font-size: 2rem;
      font-weight: 560;
      letter-spacing: -0.03em;
    }
    .lead {
      margin: 0 0 2.4rem;
      color: var(--muted);
      max-width: 26rem;
    }
    nav {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      border-top: 1px solid var(--line);
      padding-top: 1.6rem;
    }
    nav a {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      width: fit-content;
    }
    nav a:hover { border-bottom-color: var(--line); }
    footer {
      margin-top: 4rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="mark">App</p>
    <h1>Raum Gottes</h1>
    <p class="lead">Ein täglicher geistlicher Begleiter. Hier findest du, was die App mit Daten macht, und wie du mich erreichst.</p>
    <nav>
      <a href="privacy.html">Datenschutz</a>
      <a href="support.html">Support</a>
      <a href="rules.html">Gemeinschaftsregeln Gebetsraum</a>
    </nav>
    <footer>Maximilian Plate, c/o Block Services, Stuttgarter Str. 106, 70736 Fellbach, Deutschland</footer>
  </main>
</body>
</html>
